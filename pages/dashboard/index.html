<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoodMap | 대시보드</title>
    <link rel="stylesheet" href="../../common.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <span class="brand-mark">M</span>
          <span class="brand-name">MoodMap</span>
        </div>
        <nav class="main-nav">
          <a href="../../index.html">홈</a>
          <a href="../dashboard/index.html">대시보드</a>
          <a href="../checkin/index.html">감정 체크인</a>
          <a href="../summary/index.html">요약</a>
          <a href="../ai-chat/index.html">AI 대화</a>
        </nav>
      </header>

      <main class="page-content">
        <section class="section-title">
          <p class="eyebrow">대시보드</p>
          <h1>최근 감정 흐름</h1>
        </section>

        <section class="summary-grid">
          <article class="card stat-card">
            <p class="label">최근 7일 평균</p>
            <h2>6.8/10</h2>
            <span class="tone tone-low">무기력함이 지속</span>
          </article>
          <article class="card stat-card">
            <p class="label">최저 감정</p>
            <h2>금요일</h2>
            <span class="tone tone-mid">혼자 있는 시간이 길었음</span>
          </article>
          <article class="card stat-card">
            <p class="label">최고 감정</p>
            <h2>일요일</h2>
            <span class="tone tone-stable">짧은 산책 후 회복</span>
          </article>
        </section>

        <section class="card card-block">
          <div class="section-header">
            <h3>주간 감정 요약</h3>
          </div>
          <ul class="note-list">
            <li>최근 일주일 동안 우울감이 점점 무거워지는 흐름을 보였어요.</li>
            <li>수면이 부족했던 날에는 무기력감과 집중력 저하가 함께 나타났어요.</li>
            <li>햇빛을 조금 본 날은 기분이 안정적으로 회복되는 편이었어요.</li>
          </ul>
        </section>
      </main>
    </div>
  </body>
</html>
